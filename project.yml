name: Lunetta
options:
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  LunettaCore:
    path: Packages/LunettaCore
  LunettaCapture:
    path: Packages/LunettaCapture
  LunettaEditor:
    path: Packages/LunettaEditor
  LunettaUI:
    path: Packages/LunettaUI
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 2.4.0
targets:
  Lunetta:
    type: application
    platform: macOS
    sources: [App]
    entitlements:
      path: App/Lunetta.entitlements
      # xcodegen writes this file from `properties`; without them it rewrites it empty (#84).
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaopcm.lunetta
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        CURRENT_PROJECT_VERSION: "0"
        LUNETTA_COMMIT: dev
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
    dependencies:
      - package: LunettaCore
      - package: LunettaCapture
      - package: LunettaEditor
      - package: LunettaUI
      - package: KeyboardShortcuts
  LunettaTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AppTests]
    dependencies:
      - target: Lunetta
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.joaopcm.lunetta.tests
  LunettaUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests, App/AccessibilityID.swift, App/ThumbnailPile.swift, Packages/LunettaCore/Sources/LunettaCore/Permissions/PickerPromptNotice.swift]
    dependencies:
      - target: Lunetta
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.joaopcm.lunetta.uitests
        TEST_TARGET_NAME: Lunetta
        SWIFT_VERSION: "5.0"
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: UITests/LunettaUITests.entitlements
schemes:
  Lunetta:
    build:
      targets:
        Lunetta: all
    test:
      targets:
        - LunettaTests
        - package: LunettaEditor/LunettaEditorTests
  LunettaUI:
    build:
      targets:
        Lunetta: all
        LunettaUITests: [test]
    test:
      targets: [LunettaUITests]
