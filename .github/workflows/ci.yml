name: ci

# The free plan runs 5 macOS jobs at once (https://docs.github.com/en/actions/reference/limits); push runs on PR branches doubled ours and got jobs cancelled with 0 steps after ~15 min.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    runs-on: ubuntu-24.04
    services:
      minio:
        # bitnamilegacy/minio:2025.4.22, pinned 2026-11-24. minio/minio and quay.io/minio/minio refused anonymous pulls (#53).
        image: bitnamilegacy/minio@sha256:50cec18ac4184af4671a78aedd5554942c8ae105d51a465fa82037949046da01
        ports: ["9000:9000"]
        env:
          MINIO_ROOT_USER: glintroot
          MINIO_ROOT_PASSWORD: glintrootsecret
    env:
      GLINT_MINIO_ENDPOINT: http://127.0.0.1:9000
      GLINT_MINIO_ROOT_USER: glintroot
      GLINT_MINIO_ROOT_PASSWORD: glintrootsecret
      GLINT_MINIO_READER_USER: glintreader
      GLINT_MINIO_READER_PASSWORD: glintreadersecret
      GLINT_MINIO_BUCKET: shots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Swift
        run: |
          curl -fsSLO "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          tar zxf swiftly-*.tar.gz
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          ./swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --use --assume-yes 6.2.1
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
      - run: swift --version
      # The image runs a setup server, stops it and starts the real one, so retry until mc gets through to the real one.
      # 60 s is a tripwire: a fresh container took 1.4 s locally (OrbStack, M-series Mac).
      - name: Create the bucket and a read-only user in MinIO
        env:
          MINIO: ${{ job.services.minio.id }}
        run: |
          deadline=$((SECONDS + 60))
          until docker exec -e B="$GLINT_MINIO_BUCKET" -e U="$GLINT_MINIO_READER_USER" -e P="$GLINT_MINIO_READER_PASSWORD" "$MINIO" sh -c '
            mc alias set ci http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
            mc mb --ignore-existing "ci/$B" &&
            mc admin user add ci "$U" "$P" &&
            { mc admin policy attach ci readonly --user "$U" || mc admin user info ci "$U" | grep -q readonly; }'
          do
            [ "$SECONDS" -lt "$deadline" ] || { echo "MinIO wasn't ready for mc within 60 s"; docker logs "$MINIO"; exit 1; }
            sleep 1
          done
          echo "MinIO ready after $SECONDS s"
      - run: swift test
        working-directory: Packages/GlintCore

  app-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-xcode
      - run: xcodegen generate
      - name: Check generate left tracked files alone
        run: git diff --exit-code -- App/
      - run: xcodebuild -scheme Glint -destination 'platform=macOS' -derivedDataPath build test
      - name: swift test GlintCore (pinned Xcode's toolchain)
        run: swift test
        working-directory: Packages/GlintCore
      - name: swift test GlintCapture (pinned Xcode's toolchain)
        run: swift test
        working-directory: Packages/GlintCapture
      - name: Short sha
        id: sha
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build Release
        run: |
          xcodebuild -scheme Glint -configuration Release -destination 'platform=macOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} GLINT_COMMIT=${{ steps.sha.outputs.short }} build
          plutil -p build/Build/Products/Release/Glint.app/Contents/Info.plist
      - name: Check build label stamping
        env:
          PLIST: build/Build/Products/Release/Glint.app/Contents/Info.plist
          WANT_COMMIT: ${{ steps.sha.outputs.short }}
          WANT_BUILD: ${{ github.run_number }}
        run: |
          commit=$(plutil -extract GlintCommit raw "$PLIST")
          build=$(plutil -extract CFBundleVersion raw "$PLIST")
          [ "$commit" = "$WANT_COMMIT" ] || { echo "GlintCommit is '$commit', expected '$WANT_COMMIT'"; exit 1; }
          [ "$build" = "$WANT_BUILD" ] || { echo "CFBundleVersion is '$build', expected '$WANT_BUILD'"; exit 1; }
      - name: Check signing secrets
        id: gate
        env:
          CERT: ${{ secrets.DEV_CERT_P12_BASE64 }}
        run: echo "enabled=$([ -n "$CERT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Skip signing notice
        if: steps.gate.outputs.enabled != 'true'
        run: echo "::notice::Signing skipped, signing secrets are unavailable to this run (fork or Dependabot PR)"
      - name: Sign and zip
        if: steps.gate.outputs.enabled == 'true'
        env:
          DEV_CERT_P12_BASE64: ${{ secrets.DEV_CERT_P12_BASE64 }}
          DEV_CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
        run: scripts/sign-and-zip.sh build/Build/Products/Release/Glint.app Glint.zip
      - name: Print designated requirement
        if: success() && steps.gate.outputs.enabled == 'true'
        run: codesign -d -r- build/Build/Products/Release/Glint.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success() && steps.gate.outputs.enabled == 'true'
        with:
          name: Glint-${{ steps.sha.outputs.short }}
          path: Glint.zip

  ui-macos:
    runs-on: macos-26
    env:
      DERIVED_DATA: build
    # 3x the first green run of all 27 UI tests on macos-26 (45497261627: 7 min 8 s).
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-xcode
      - run: xcodegen generate
      - run: scripts/ci-grant-tcc.sh kTCCServiceScreenCapture com.joaopcm.glint com.joaopcm.glint.uitests.xctrunner
      - run: scripts/ci-grant-tcc.sh kTCCServicePostEvent com.joaopcm.glint.uitests.xctrunner
      - run: sudo automationmodetool enable-automationmode-without-authentication
      # macOS 15 shows its own "bypass the private window picker" prompt on top of the TCC grant (run 45266766603).
      - name: Pre-approve the private window picker prompt
        env:
          GLINT_EXECUTABLE: ${{ github.workspace }}/${{ env.DERIVED_DATA }}/Build/Products/Debug/Glint.app/Contents/MacOS/Glint
        run: |
          APPROVALS="$HOME/Library/Group Containers/group.com.apple.replayd/ScreenCaptureApprovals.plist"
          mkdir -p "$(dirname "$APPROVALS")"
          defaults write "$APPROVALS" "$GLINT_EXECUTABLE" -date "4000-01-01 00:00:00 +0000"
          defaults read "$APPROVALS" "$GLINT_EXECUTABLE"
      # A failing run took 8 min 1 s here (45493012014) and the slowest test 29.5 s (45499134237). The per-test cap lets
      # xcodebuild kill a hung test and still finalize ui.xcresult; the step cap leaves the upload time inside the job's.
      - run: |
          xcodebuild -scheme GlintUI -destination 'platform=macOS' -derivedDataPath "$DERIVED_DATA" -resultBundlePath ui.xcresult \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 120 test
        timeout-minutes: 19
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ui-xcresult-${{ github.run_attempt }}
          path: ui.xcresult
          retention-days: 7
