name: ci

# The free plan runs 5 macOS jobs at once (https://docs.github.com/en/actions/reference/limits); push runs on PR branches doubled ours and got jobs cancelled with 0 steps after ~15 min.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancelling on main left merged code unverified: runs 45508978649 and 45509782042 were cancelled mid ui-macos by the next merge.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  core-linux:
    runs-on: ubuntu-24.04
    services:
      minio:
        # bitnamilegacy/minio:2025.4.22, pinned 2026-11-24. minio/minio and quay.io/minio/minio refused anonymous pulls (#53).
        image: bitnamilegacy/minio@sha256:50cec18ac4184af4671a78aedd5554942c8ae105d51a465fa82037949046da01
        ports: ["9000:9000"]
        env:
          MINIO_ROOT_USER: lunettaroot
          MINIO_ROOT_PASSWORD: lunettarootsecret
    env:
      LUNETTA_MINIO_ENDPOINT: http://127.0.0.1:9000
      LUNETTA_MINIO_ROOT_USER: lunettaroot
      LUNETTA_MINIO_ROOT_PASSWORD: lunettarootsecret
      LUNETTA_MINIO_READER_USER: lunettareader
      LUNETTA_MINIO_READER_PASSWORD: lunettareadersecret
      LUNETTA_MINIO_BUCKET: shots
      LUNETTA_MINIO_PUBLIC_BUCKET: shots-public
      LUNETTA_MINIO_POLICY_BUCKET: shots-policy
      SWIFT_VERSION: 6.2.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: swift-cache
        with:
          path: ~/.local/share/swiftly
          key: swiftly-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_VERSION }}
      - name: Install Swift
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSLO "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          tar zxf swiftly-*.tar.gz
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          ./swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --use --assume-yes "$SWIFT_VERSION"
      - run: echo "$HOME/.local/share/swiftly/toolchains/$SWIFT_VERSION/usr/bin" >> "$GITHUB_PATH"
      - run: swift --version
      # The image runs a setup server, stops it and starts the real one, so retry until mc gets through to the real one.
      # 60 s is a tripwire: a fresh container took 1.4 s locally (OrbStack, M-series Mac).
      - name: Create the buckets and a read-only user in MinIO
        env:
          MINIO: ${{ job.services.minio.id }}
        run: |
          deadline=$((SECONDS + 60))
          until docker exec -e B="$LUNETTA_MINIO_BUCKET" -e PB="$LUNETTA_MINIO_PUBLIC_BUCKET" -e PolB="$LUNETTA_MINIO_POLICY_BUCKET" \
            -e U="$LUNETTA_MINIO_READER_USER" -e P="$LUNETTA_MINIO_READER_PASSWORD" "$MINIO" sh -c '
            mc alias set ci http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
            mc mb --ignore-existing "ci/$B" "ci/$PB" "ci/$PolB" &&
            mc anonymous set download "ci/$PB" &&
            mc admin user add ci "$U" "$P" &&
            { mc admin policy attach ci readonly --user "$U" || mc admin user info ci "$U" | grep -q readonly; }'
          do
            [ "$SECONDS" -lt "$deadline" ] || { echo "MinIO wasn't ready for mc within 60 s"; docker logs "$MINIO"; exit 1; }
            sleep 1
          done
          echo "MinIO ready after $SECONDS s"
      - run: swift test
        working-directory: Packages/LunettaCore

  app-macos:
    runs-on: macos-26
    env:
      COMPILATION_CACHE_ENABLE_CACHING: YES
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-xcode
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/CompilationCache.noindex
          key: xcode-app-${{ hashFiles('.github/actions/setup-xcode/action.yml', 'project.yml') }}-${{ github.sha }}
          restore-keys: xcode-app-${{ hashFiles('.github/actions/setup-xcode/action.yml', 'project.yml') }}-
      - run: xcodegen generate
      - name: Check generate left tracked files alone
        run: git diff --exit-code -- App/
      - run: xcodebuild -scheme Lunetta -destination 'platform=macOS' -derivedDataPath build COMPILATION_CACHE_ENABLE_CACHING="$COMPILATION_CACHE_ENABLE_CACHING" test
      - name: swift test LunettaCore (pinned Xcode's toolchain)
        run: swift test
        working-directory: Packages/LunettaCore
      - name: swift test LunettaCapture (pinned Xcode's toolchain)
        run: swift test
        working-directory: Packages/LunettaCapture
      - name: Short sha
        id: sha
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build Release
        run: |
          xcodebuild -scheme Lunetta -configuration Release -destination 'platform=macOS' -derivedDataPath build COMPILATION_CACHE_ENABLE_CACHING="$COMPILATION_CACHE_ENABLE_CACHING" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} LUNETTA_COMMIT=${{ steps.sha.outputs.short }} build
          plutil -p build/Build/Products/Release/Lunetta.app/Contents/Info.plist
      # Hardened runtime blocks the mic without this entitlement, and CI has no mic to notice (#84).
      - name: Check the mic entitlement
        env:
          APP: build/Build/Products/Release/Lunetta.app
        run: |
          codesign -d --entitlements - --xml "$APP" > "$RUNNER_TEMP/entitlements.plist"
          value=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' "$RUNNER_TEMP/entitlements.plist" 2>&1) || true
          [ "$value" = true ] || { echo "::error::$APP is missing com.apple.security.device.audio-input=true (got: $value). Add it under entitlements.properties in project.yml"; exit 1; }
      - name: Check the app icon
        env:
          APP: build/Build/Products/Release/Lunetta.app
        run: |
          plist="$APP/Contents/Info.plist"
          for key in CFBundleIconFile CFBundleIconName; do
            value=$(plutil -extract "$key" raw "$plist" 2>&1) || true
            [ "$value" = AppIcon ] || { echo "::error::$key is '$value', expected AppIcon. Check App/AppIcon.icon and ASSETCATALOG_COMPILER_APPICON_NAME in project.yml"; exit 1; }
          done
          [ -s "$APP/Contents/Resources/AppIcon.icns" ] || { echo "::error::$APP has no Contents/Resources/AppIcon.icns, so macOS 15 shows a blank icon"; exit 1; }
          ls -l "$APP/Contents/Resources"
      - name: Check build label stamping
        env:
          PLIST: build/Build/Products/Release/Lunetta.app/Contents/Info.plist
          WANT_COMMIT: ${{ steps.sha.outputs.short }}
          WANT_BUILD: ${{ github.run_number }}
        run: |
          commit=$(plutil -extract LunettaCommit raw "$PLIST")
          build=$(plutil -extract CFBundleVersion raw "$PLIST")
          [ "$commit" = "$WANT_COMMIT" ] || { echo "LunettaCommit is '$commit', expected '$WANT_COMMIT'"; exit 1; }
          [ "$build" = "$WANT_BUILD" ] || { echo "CFBundleVersion is '$build', expected '$WANT_BUILD'"; exit 1; }
      - name: Check signing secrets
        id: gate
        env:
          CERT: ${{ secrets.DEV_CERT_P12_BASE64 }}
        run: echo "enabled=$([ -n "$CERT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Skip signing notice
        if: steps.gate.outputs.enabled != 'true'
        run: echo "::notice::Signing skipped, signing secrets are unavailable to this run (fork or Dependabot PR)"
      - name: Sign and zip
        if: steps.gate.outputs.enabled == 'true'
        env:
          DEV_CERT_P12_BASE64: ${{ secrets.DEV_CERT_P12_BASE64 }}
          DEV_CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
        run: scripts/sign-and-zip.sh build/Build/Products/Release/Lunetta.app Lunetta.zip
      - name: Print designated requirement
        if: success() && steps.gate.outputs.enabled == 'true'
        run: codesign -d -r- build/Build/Products/Release/Lunetta.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success() && steps.gate.outputs.enabled == 'true'
        with:
          name: Lunetta-${{ steps.sha.outputs.short }}
          path: Lunetta.zip

  ui-shard:
    name: ui-macos (${{ matrix.shard }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            select: only-testing
          - shard: b
            select: skip-testing
    env:
      DERIVED_DATA: build
      COMPILATION_CACHE_ENABLE_CACHING: YES
      # These two ran 285 s of UI tests and the rest 293 s in run 45664723521. New classes land in shard b.
      SHARD_A_CLASSES: QuickAccessUITests MenuAndSettingsUITests
    # The test step's cap plus the 30 s of setup before it and the upload after it, rounded up.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-xcode
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/CompilationCache.noindex
          key: xcode-ui-${{ matrix.shard }}-${{ hashFiles('.github/actions/setup-xcode/action.yml', 'project.yml') }}-${{ github.sha }}
          restore-keys: xcode-ui-${{ matrix.shard }}-${{ hashFiles('.github/actions/setup-xcode/action.yml', 'project.yml') }}-
      - run: xcodegen generate
      - run: scripts/ci-grant-tcc.sh kTCCServiceScreenCapture com.joaopcm.lunetta com.joaopcm.lunetta.uitests.xctrunner
      - run: scripts/ci-grant-tcc.sh kTCCServicePostEvent com.joaopcm.lunetta.uitests.xctrunner
      - run: scripts/ci-grant-tcc.sh kTCCServiceAccessibility com.joaopcm.lunetta.uitests.xctrunner
      - run: sudo automationmodetool enable-automationmode-without-authentication
      # The quick-access card faded in place instead of sliding on the runner (recording in run 45611987356, #92),
      # which is what Lunetta does under Reduce Motion.
      - name: Turn Reduce Motion off
        run: |
          echo "before: $(defaults read com.apple.universalaccess reduceMotion 2>&1)"
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults read com.apple.universalaccess reduceMotion
      # macOS 15 shows its own "bypass the private window picker" prompt on top of the TCC grant (run 45266766603).
      - name: Pre-approve the private window picker prompt
        env:
          LUNETTA_EXECUTABLE: ${{ github.workspace }}/${{ env.DERIVED_DATA }}/Build/Products/Debug/Lunetta.app/Contents/MacOS/Lunetta
        run: |
          APPROVALS="$HOME/Library/Group Containers/group.com.apple.replayd/ScreenCaptureApprovals.plist"
          mkdir -p "$(dirname "$APPROVALS")"
          defaults write "$APPROVALS" "$LUNETTA_EXECUTABLE" -date "4000-01-01 00:00:00 +0000"
          defaults read "$APPROVALS" "$LUNETTA_EXECUTABLE"
      # The slowest test took 48.9 s (45642473032) and the slowest shard 7 min 0 s with a cold cache (45654796825), so the
      # step cap is 2x that. The per-test cap lets xcodebuild kill a hung test and still finalize ui.xcresult; the step
      # cap leaves the upload time inside the job's.
      - run: |
          selection=()
          for class in $SHARD_A_CLASSES; do selection+=("-${{ matrix.select }}:LunettaUITests/$class"); done
          xcodebuild -scheme LunettaUI -destination 'platform=macOS' -derivedDataPath "$DERIVED_DATA" -resultBundlePath ui.xcresult \
            COMPILATION_CACHE_ENABLE_CACHING="$COMPILATION_CACHE_ENABLE_CACHING" "${selection[@]}" \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 120 test
        timeout-minutes: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ui-xcresult-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ui.xcresult
          retention-days: 7

  ui-macos:
    needs: ui-shard
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: '[ "$RESULT" = success ] || { echo "::error::a ui-macos shard ended with $RESULT"; exit 1; }'
        env:
          RESULT: ${{ needs.ui-shard.result }}
